<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Lage-Check für Immobilienmakler: Adresse suchen, Grundstück einzeichnen, Umgebung prüfen."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Lage-Check</title>
    <script>
      ;(function () {
        var mode = null
        try {
          mode = localStorage.getItem('%VITE_THEME_STORAGE_KEY%')
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
